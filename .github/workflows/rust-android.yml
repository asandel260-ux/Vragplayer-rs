name: Rust VragPlayer Build & Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-desktop:
    name: Rust Tests & Linux Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux audio & GUI system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libgtk-3-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: vragplayer-rs

      - name: Run Rust unit tests
        working-directory: vragplayer-rs
        run: cargo test --verbose

      - name: Build Linux release binary
        working-directory: vragplayer-rs
        run: cargo build --release --bin vragplayer

      - name: Upload Linux binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: vragplayer-rust-linux
          path: vragplayer-rs/target/release/vragplayer
          if-no-files-found: error

  build-android-apk:
    name: Build Pure-Rust Android APK
    runs-on: ubuntu-latest
    needs: test-and-desktop

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust toolchain with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: vragplayer-rs

      - name: Configure Android SDK & NDK environment
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" \
            "build-tools;34.0.0" >/dev/null || true

          NDK_PATH=$(ls -d "$SDK_ROOT"/ndk/27.* 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$NDK_PATH" ]; then
            NDK_PATH=$(ls -d "$SDK_ROOT"/ndk/* 2>/dev/null | sort -V | tail -n 1 || true)
          fi
          if [ -z "$NDK_PATH" ]; then
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;27.3.13750724" >/dev/null
            NDK_PATH="$SDK_ROOT/ndk/27.3.13750724"
          fi
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_LATEST_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "Using Android SDK: $SDK_ROOT"
          echo "Using Android NDK: $NDK_PATH"

      - name: Install cargo-apk
        run: cargo install cargo-apk --locked

      - name: Prepare APK signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          KEYSTORE_PATH="${{ runner.temp }}/vragplayer-release.keystore"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            KEYSTORE_PASS="$ANDROID_KEYSTORE_PASSWORD"
            echo "Using release keystore from GitHub Secrets"
          else
            KEYSTORE_PASS=$(openssl rand -hex 16)
            echo "::add-mask::$KEYSTORE_PASS"
            keytool -genkeypair -noprompt \
              -keystore "$KEYSTORE_PATH" \
              -storepass "$KEYSTORE_PASS" \
              -keypass "$KEYSTORE_PASS" \
              -alias vragplayer \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=VragPlayer, OU=Studio, O=VragPlayer, L=Local, S=Local, C=US"
            echo "Generated ephemeral CI release keystore for APK signing"
          fi
          echo "CARGO_APK_RELEASE_KEYSTORE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> "$GITHUB_ENV"

      - name: Build Pure-Rust Android APK
        working-directory: vragplayer-rs
        run: cargo apk build --release --lib

      - name: Upload Pure-Rust Android APK
        uses: actions/upload-artifact@v4
        with:
          name: vragplayer-rust-android-apk
          path: vragplayer-rs/target/**/*.apk
          if-no-files-found: error
