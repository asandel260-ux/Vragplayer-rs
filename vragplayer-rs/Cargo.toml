[package]
name = "vragplayer_rs"
version = "1.0.0"
edition = "2021"
description = "VragPlayer — Pure Rust local music player for Android and Desktop"

[lib]
name = "vragplayer_rs"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "vragplayer"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow"] }
cpal = "0.15.3"
symphonia = { version = "0.5.4", default-features = false, features = ["mp3", "flac", "wav", "ogg", "vorbis", "aac", "isomp4", "alac", "pcm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "android-native-activity"] }
winit = { version = "0.30.9", features = ["android-native-activity"] }
android_logger = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[package.metadata.android]
package = "com.example.jtptgk.rust"
apk_name = "VragPlayer"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi"]

[package.metadata.android.application]
label = "VragPlayer"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_AUDIO"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

[[package.metadata.android.uses_permission]]
name = "android.permission.WAKE_LOCK"
